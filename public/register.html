<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — Smart Library</title>
  <meta name="description" content="Create your Smart Library account to start booking seats and borrowing books.">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages.css">
  <link rel="stylesheet" href="/css/dark.css">
</head>
<body>
  <div class="auth-page">
    <!-- Left: Illustration -->
    <div class="auth-illustration">
      <div class="auth-illustration-content">
        <span class="auth-illustration-emoji">🎓</span>
        <h2>Join Smart Library</h2>
        <p>Create an account and start booking library seats, borrowing books, and more — instantly.</p>
      </div>
    </div>

    <!-- Right: Form -->
    <div class="auth-form-side">
      <div class="auth-form-container">
        <a href="/" class="auth-logo">
          <div class="auth-logo-icon">📖</div>
          <span>SmartLib</span>
        </a>

        <h1>Create Account</h1>
        <p class="auth-subtitle">Fill in your details to get started</p>

        <form class="auth-form" id="register-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="reg-name">Full Name</label>
            <input type="text" id="reg-name" class="form-input" placeholder="John Doe" autocomplete="name" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-email">Email Address</label>
            <input type="email" id="reg-email" class="form-input" placeholder="you@example.com" autocomplete="email" required>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4);">
            <div class="form-group">
              <label class="form-label" for="reg-studentId">Student ID</label>
              <input type="text" id="reg-studentId" class="form-input" placeholder="STU001" autocomplete="off">
              <span class="form-hint">Optional</span>
            </div>

            <div class="form-group">
              <label class="form-label" for="reg-phone">Phone Number</label>
              <input type="tel" id="reg-phone" class="form-input" placeholder="9876543210" autocomplete="tel">
              <span class="form-hint">Optional</span>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-password">Password</label>
            <div class="input-group">
              <input type="password" id="reg-password" class="form-input" placeholder="Min. 6 characters" autocomplete="new-password" required>
              <button type="button" class="input-icon password-toggle" aria-label="Toggle password visibility">👁️</button>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-confirm-password">Confirm Password</label>
            <div class="input-group">
              <input type="password" id="reg-confirm-password" class="form-input" placeholder="Re-enter password" autocomplete="new-password" required>
              <button type="button" class="input-icon password-toggle" aria-label="Toggle password visibility">👁️</button>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-lg w-full" id="register-btn">
            Create Account
          </button>
        </form>

        <div class="divider"></div>

        <p class="auth-footer">
          Already have an account? <a href="/login">Log in</a>
        </p>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
