<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Catalog — Smart Library</title>
  <meta name="description" content="Browse, search, and request books from the Smart Library catalog.">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages.css">
  <link rel="stylesheet" href="/css/dark.css">
  <style>
    .book-card {
      background: var(--surface-glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius);
      overflow: hidden;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
      box-shadow: var(--shadow-glass);
    }
    .book-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: var(--gradient-glass-border);
      opacity: 0.7;
      z-index: 1;
    }
    .book-card:hover {
      box-shadow: var(--shadow-3d);
      transform: translateY(-8px) rotateX(var(--rotate-subtle)) scale(1.02);
      border-color: rgba(99, 102, 241, 0.2);
    }
    .book-cover {
      width: 100%;
      height: 200px;
      object-fit: cover;
      background: var(--gradient-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 64px;
      position: relative;
      overflow: hidden;
    }
    .book-cover::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 60%, var(--surface-glass) 100%);
      pointer-events: none;
    }
    .book-cover img { width: 100%; height: 100%; object-fit: cover; }
    .book-card-body { padding: var(--space-4); }
    .book-card-body h4 {
      font-size: var(--text-sm);
      font-weight: 600;
      margin-bottom: var(--space-1);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .book-card-body .author {
      font-size: var(--text-xs);
      color: var(--muted);
      margin-bottom: var(--space-3);
    }
    .book-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
    }
    .availability { font-size: var(--text-xs); font-weight: 600; }
    .avail-yes { color: var(--success); }
    .avail-no { color: var(--danger); }
  </style>
</head>
<body>
  <main class="page">
    <div class="container">
      <div class="section-header animate-in">
        <h1>📚 Book Catalog</h1>
      </div>

      <!-- Search -->
      <div class="search-bar animate-in">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" class="form-input" placeholder="Search books by title, author, or tag...">
      </div>

      <!-- Category chips -->
      <div class="chips-row animate-in" id="category-chips">
        <button class="chip active" data-category="all">All</button>
        <button class="chip" data-category="Programming">💻 Programming</button>
        <button class="chip" data-category="Science">🔬 Science</button>
        <button class="chip" data-category="Fiction">📖 Fiction</button>
        <button class="chip" data-category="History">🏛️ History</button>
        <button class="chip" data-category="Business">💼 Business</button>
        <button class="chip" data-category="Engineering">⚙️ Engineering</button>
      </div>

      <!-- Availability toggle -->
      <div style="display:flex; align-items:center; gap:var(--space-3); margin-bottom:var(--space-6);" class="animate-in">
        <label style="font-size:var(--text-sm); color:var(--muted); display:flex; align-items:center; gap:var(--space-2); cursor:pointer;">
          <input type="checkbox" id="available-only" style="accent-color:var(--primary); width:18px; height:18px;">
          Show available only
        </label>
        <span class="text-muted" style="font-size:var(--text-xs);" id="results-count"></span>
      </div>

      <!-- Book Grid -->
      <div class="cards-grid cards-grid-sm" id="books-grid"></div>

      <!-- Pagination -->
      <div style="display:flex; justify-content:center; gap:var(--space-2); margin-top:var(--space-8);" id="pagination"></div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    let currentCategory = 'all';
    let currentSearch = '';
    let availableOnly = false;
    let currentPage = 1;
    let searchTimeout = null;
    const currentUser = api.getUser();
    const userRole = currentUser ? currentUser.role : 'student';
    const canBorrow = ['student', 'staff'].includes(userRole);
    const canManage = ['staff', 'admin'].includes(userRole);

    document.addEventListener('DOMContentLoaded', async () => {
      if (!requireAuth()) return;
      renderNavbar('catalog');

      // Search with debounce
      document.getElementById('search-input').addEventListener('input', (e) => {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => {
          currentSearch = e.target.value.trim();
          currentPage = 1;
          loadBooks();
        }, 300);
      });

      // Category chips
      document.querySelectorAll('#category-chips .chip').forEach(chip => {
        chip.addEventListener('click', () => {
          document.querySelectorAll('#category-chips .chip').forEach(c => c.classList.remove('active'));
          chip.classList.add('active');
          currentCategory = chip.dataset.category;
          currentPage = 1;
          loadBooks();
        });
      });

      // Availability toggle
      document.getElementById('available-only').addEventListener('change', (e) => {
        availableOnly = e.target.checked;
        currentPage = 1;
        loadBooks();
      });

      // Show 'Add Book' button for staff/admin
      if (canManage) {
        const headerEl = document.querySelector('.section-header');
        const addBtn = document.createElement('button');
        addBtn.className = 'btn btn-primary btn-sm';
        addBtn.textContent = '+ Add Book';
        addBtn.addEventListener('click', showAddBookModal);
        headerEl.appendChild(addBtn);
      }

      await loadBooks();
    });

    async function loadBooks() {
      const grid = document.getElementById('books-grid');
      showSkeleton(grid, 6);

      try {
        let url = `/books?page=${currentPage}&limit=18`;
        if (currentSearch) url += `&search=${encodeURIComponent(currentSearch)}`;
        if (currentCategory !== 'all') url += `&category=${currentCategory}`;
        if (availableOnly) url += `&available=true`;

        const data = await api.get(url);
        const books = data.books || [];

        document.getElementById('results-count').textContent = `${data.total || 0} books found`;

        if (books.length === 0) {
          showEmptyState(grid, {
            icon: '📚',
            title: 'No Books Found',
            message: 'Try a different search or category.'
          });
          document.getElementById('pagination').innerHTML = '';
          return;
        }

        grid.innerHTML = books.map(book => {
          const available = book.availableCopies > 0;
          const coverHtml = book.coverUrl
            ? `<div class="book-cover"><img src="${book.coverUrl}" alt="${book.title}" onerror="this.parentElement.innerHTML='📚'"></div>`
            : `<div class="book-cover">📚</div>`;

          // Build action buttons based on role
          let actionButtons = '';
          if (canBorrow) {
            if (available) {
              actionButtons += `<button class="btn btn-primary btn-sm" onclick="requestBook('${book._id}', '${book.title.replace(/'/g, "\\'")}')">Request</button>`;
            } else {
              actionButtons += `<button class="btn btn-secondary btn-sm" onclick="joinWaitlist('${book._id}', '${book.title.replace(/'/g, "\\'")}')">Waitlist</button>`;
            }
          }
          if (canManage) {
            actionButtons += ` <button class="btn btn-ghost btn-sm" onclick="showEditBookModal('${book._id}')">✏️ Edit</button>`;
          }

          return `
            <div class="book-card animate-in">
              ${coverHtml}
              <div class="book-card-body">
                <h4>${book.title}</h4>
                <p class="author">${book.author}</p>
                <div style="display:flex; gap:var(--space-1); flex-wrap:wrap; margin-bottom:var(--space-3);">
                  <span class="badge badge-primary">${book.category}</span>
                  ${book.publishedYear ? `<span class="badge badge-neutral">${book.publishedYear}</span>` : ''}
                </div>
                <div class="book-card-footer">
                  <span class="availability ${available ? 'avail-yes' : 'avail-no'}">
                    ${available ? `${book.availableCopies}/${book.totalCopies} available` : 'Unavailable'}
                  </span>
                  <div style="display:flex; gap:var(--space-1);">
                    ${actionButtons}
                  </div>
                </div>
              </div>
            </div>
          `;
        }).join('');

        // Pagination
        renderPagination(data.pages, data.page);
      } catch (err) {
        Toast.error(err.message || 'Failed to load books');
        grid.innerHTML = '';
      }
    }

    function renderPagination(totalPages, current) {
      const container = document.getElementById('pagination');
      if (totalPages <= 1) { container.innerHTML = ''; return; }

      let html = '';
      for (let i = 1; i <= totalPages; i++) {
        html += `<button class="btn ${i === current ? 'btn-primary' : 'btn-secondary'} btn-sm" onclick="goToPage(${i})">${i}</button>`;
      }
      container.innerHTML = html;
    }

    function goToPage(page) {
      currentPage = page;
      loadBooks();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function requestBook(bookId, title) {
      try {
        await api.post('/borrowings/request', { bookId });
        Toast.success(`Request submitted for "${title}"!`, '📗 Book Requested');
        loadBooks();
      } catch (err) {
        Toast.error(err.message || 'Request failed');
      }
    }

    async function joinWaitlist(bookId, title) {
      try {
        await api.post(`/waitlist/${bookId}`);
        Toast.success(`Added to waitlist for "${title}"`, '📋 Waitlisted');
      } catch (err) {
        Toast.error(err.message || 'Failed to join waitlist');
      }
    }

    // ─── Add / Edit Book Modals (Staff & Admin) ───
    function showAddBookModal() {
      Modal.create({
        title: '📗 Add New Book',
        id: 'add-book-modal',
        content: `
          <form id="add-book-form">
            <div class="form-group"><label class="form-label">Title</label><input type="text" class="form-input" name="title" required></div>
            <div class="form-group"><label class="form-label">Author</label><input type="text" class="form-input" name="author" required></div>
            <div class="form-group"><label class="form-label">Category</label>
              <select class="form-input" name="category">
                <option>Programming</option><option>Science</option><option>Fiction</option>
                <option>History</option><option>Business</option><option>Engineering</option><option>Other</option>
              </select>
            </div>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:var(--space-3);">
              <div class="form-group"><label class="form-label">Total Copies</label><input type="number" class="form-input" name="totalCopies" min="1" value="1" required></div>
              <div class="form-group"><label class="form-label">Published Year</label><input type="number" class="form-input" name="publishedYear" placeholder="2024"></div>
            </div>
            <div class="form-group"><label class="form-label">Cover URL (optional)</label><input type="text" class="form-input" name="coverUrl" placeholder="https://..."></div>
            <div class="form-group"><label class="form-label">Tags (comma-separated)</label><input type="text" class="form-input" name="tags" placeholder="javascript, web"></div>
            <button type="submit" class="btn btn-primary w-full" style="margin-top:var(--space-3);">Add Book</button>
          </form>
        `
      });
      document.getElementById('add-book-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const body = Object.fromEntries(fd.entries());
        body.totalCopies = parseInt(body.totalCopies) || 1;
        body.availableCopies = body.totalCopies;
        body.publishedYear = body.publishedYear ? parseInt(body.publishedYear) : undefined;
        body.tags = body.tags ? body.tags.split(',').map(t => t.trim()) : [];
        try {
          await api.post('/books', body);
          Toast.success('Book added successfully!', '📗 Added');
          Modal.hide('add-book-modal');
          loadBooks();
        } catch (err) { Toast.error(err.message || 'Failed to add book'); }
      });
    }

    async function showEditBookModal(bookId) {
      try {
        const res = await api.get(`/books/${bookId}`);
        const book = res.book;
        Modal.create({
          title: '✏️ Edit Book',
          id: 'edit-book-modal',
          content: `
            <form id="edit-book-form">
              <div class="form-group"><label class="form-label">Title</label><input type="text" class="form-input" name="title" value="${book.title}" required></div>
              <div class="form-group"><label class="form-label">Author</label><input type="text" class="form-input" name="author" value="${book.author}" required></div>
              <div class="form-group"><label class="form-label">Category</label>
                <select class="form-input" name="category">
                  ${['Programming','Science','Fiction','History','Business','Engineering','Other'].map(c => `<option ${book.category === c ? 'selected' : ''}>${c}</option>`).join('')}
                </select>
              </div>
              <div style="display:grid; grid-template-columns:1fr 1fr; gap:var(--space-3);">
                <div class="form-group"><label class="form-label">Total Copies</label><input type="number" class="form-input" name="totalCopies" min="1" value="${book.totalCopies}" required></div>
                <div class="form-group"><label class="form-label">Available Copies</label><input type="number" class="form-input" name="availableCopies" min="0" value="${book.availableCopies}" required></div>
              </div>
              <div class="form-group"><label class="form-label">Cover URL (optional)</label><input type="text" class="form-input" name="coverUrl" value="${book.coverUrl || ''}"></div>
              <div class="form-group"><label class="form-label">Tags (comma-separated)</label><input type="text" class="form-input" name="tags" value="${(book.tags || []).join(', ')}"></div>
              <button type="submit" class="btn btn-primary w-full" style="margin-top:var(--space-3);">Save Changes</button>
            </form>
          `
        });
        document.getElementById('edit-book-form').addEventListener('submit', async (e) => {
          e.preventDefault();
          const fd = new FormData(e.target);
          const body = Object.fromEntries(fd.entries());
          body.totalCopies = parseInt(body.totalCopies) || 1;
          body.availableCopies = parseInt(body.availableCopies) || 0;
          body.tags = body.tags ? body.tags.split(',').map(t => t.trim()) : [];
          try {
            await api.put(`/books/${bookId}`, body);
            Toast.success('Book updated!', '✏️ Updated');
            Modal.hide('edit-book-modal');
            loadBooks();
          } catch (err) { Toast.error(err.message || 'Failed to update book'); }
        });
      } catch (err) { Toast.error(err.message || 'Failed to load book details'); }
    }
  </script>
</body>
</html>
