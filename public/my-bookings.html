<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Bookings — Smart Library</title>
  <meta name="description" content="View your seat bookings, scan QR codes, cancel, and check out.">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages.css">
  <link rel="stylesheet" href="/css/dark.css">
  <style>
    /* ─── Glass Booking Card ─── */
    .booking-card {
      background: var(--surface-glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius);
      padding: var(--space-5);
      margin-bottom: var(--space-4);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow-glass);
    }
    .booking-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: var(--gradient-glass-border);
      opacity: 0.7;
    }
    .booking-card:hover {
      box-shadow: var(--shadow-3d);
      transform: translateY(-4px) rotateX(var(--rotate-subtle));
      border-color: rgba(99, 102, 241, 0.2);
    }
    .booking-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--space-3);
      flex-wrap: wrap;
      gap: var(--space-2);
    }
    .booking-card-body {
      display: flex;
      align-items: center;
      gap: var(--space-4);
      flex-wrap: wrap;
    }
    .booking-seat-badge {
      width: 56px;
      height: 56px;
      background: var(--gradient);
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 700;
      font-size: var(--text-lg);
      flex-shrink: 0;
      box-shadow: 0 8px 25px -5px rgba(99, 102, 241, 0.4);
      transition: transform 0.3s ease;
    }
    .booking-card:hover .booking-seat-badge {
      transform: scale(1.08) rotateZ(-3deg);
    }
    .booking-info { flex: 1; min-width: 200px; }
    .booking-actions {
      display: flex;
      gap: var(--space-2);
      flex-wrap: wrap;
    }
    .booking-timer {
      font-size: var(--text-sm);
      font-weight: 600;
      padding: var(--space-1) var(--space-3);
      border-radius: var(--radius-full);
      backdrop-filter: blur(8px);
    }
    .timer-upcoming { background: var(--info-bg); color: var(--info); }
    .timer-checkin { background: var(--warning-bg); color: var(--warning); }
    .timer-active { background: var(--success-bg); color: var(--success); }

    /* Cancel button countdown styling */
    .cancel-countdown {
      font-size: var(--text-xs);
      color: var(--muted);
      margin-top: var(--space-1);
      display: block;
    }
    .btn-cancel-disabled {
      opacity: 0.35 !important;
      cursor: not-allowed !important;
      pointer-events: none !important;
      position: relative;
    }
    .btn-cancel-disabled::after {
      content: '🔒';
      margin-left: var(--space-1);
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="container">
      <div class="section-header animate-in">
        <h1>My Bookings</h1>
        <a href="/seats" class="btn btn-primary btn-sm">+ Book a Seat</a>
      </div>

      <!-- Tabs -->
      <div class="tabs animate-in" id="booking-tabs">
        <button class="tab active" data-tab="upcoming">Upcoming</button>
        <button class="tab" data-tab="active">Active</button>
        <button class="tab" data-tab="past">Past</button>
      </div>

      <!-- Booking List -->
      <div id="bookings-list" style="margin-top:var(--space-6);"></div>
    </div>
  </main>

  <!-- QR Modal -->
  <div class="modal-overlay" id="qr-modal">
    <div class="modal">
      <div class="modal-header">
        <h3>Your QR Code</h3>
        <button class="modal-close" onclick="Modal.hide('qr-modal')">&times;</button>
      </div>
      <div class="modal-body">
        <div id="qr-display" style="text-align:center;"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="Modal.hide('qr-modal')">Close</button>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    let allBookings = [];
    let activeTab = 'upcoming';
    let timers = [];

    // Cancel window: 2 minutes (120,000 ms)
    const CANCEL_WINDOW_MS = 2 * 60 * 1000;

    document.addEventListener('DOMContentLoaded', async () => {
      if (!requireAuth()) return;
      renderNavbar('my-bookings');

      // Tab switching
      document.querySelectorAll('#booking-tabs .tab').forEach(tab => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('#booking-tabs .tab').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          activeTab = tab.dataset.tab;
          renderBookings();
        });
      });

      await loadBookings();

      // Update timers every second
      setInterval(updateTimers, 1000);
    });

    async function loadBookings() {
      const container = document.getElementById('bookings-list');
      showSkeleton(container, 3);

      try {
        const data = await api.get('/bookings/mine');
        allBookings = data.bookings || [];
        renderBookings();
      } catch (err) {
        Toast.error(err.message || 'Failed to load bookings');
        container.innerHTML = '';
      }
    }

    /**
     * Check if a booking is still within the 2-minute cancel window
     */
    function isCancelAllowed(booking) {
      const createdAt = new Date(booking.createdAt).getTime();
      const now = Date.now();
      return (now - createdAt) < CANCEL_WINDOW_MS;
    }

    /**
     * Get remaining cancel time in seconds
     */
    function getCancelTimeLeft(booking) {
      const createdAt = new Date(booking.createdAt).getTime();
      const elapsed = Date.now() - createdAt;
      const remaining = CANCEL_WINDOW_MS - elapsed;
      return Math.max(0, Math.ceil(remaining / 1000));
    }

    function renderBookings() {
      const container = document.getElementById('bookings-list');
      timers = [];

      const now = new Date();
      let filtered;

      if (activeTab === 'upcoming') {
        filtered = allBookings.filter(b => b.status === 'booked');
      } else if (activeTab === 'active') {
        filtered = allBookings.filter(b => b.status === 'checked_in');
      } else {
        filtered = allBookings.filter(b => ['completed', 'cancelled', 'expired'].includes(b.status));
      }

      if (filtered.length === 0) {
        const msgs = {
          upcoming: { icon: '📅', title: 'No Upcoming Bookings', msg: 'Book a seat to get started!' },
          active: { icon: '✅', title: 'No Active Sessions', msg: 'Check in at the entrance with your QR code.' },
          past: { icon: '📋', title: 'No Past Bookings', msg: 'Your booking history will appear here.' }
        };
        showEmptyState(container, { icon: msgs[activeTab].icon, title: msgs[activeTab].title, message: msgs[activeTab].msg, actionText: 'Book a Seat', actionHref: '/seats' });
        return;
      }

      container.innerHTML = filtered.map(booking => {
        const seat = booking.seat || {};
        const statusColors = {
          booked: 'badge-primary',
          checked_in: 'badge-success',
          completed: 'badge-info',
          cancelled: 'badge-neutral',
          expired: 'badge-danger'
        };
        const statusLabels = {
          booked: 'Booked',
          checked_in: 'Checked In',
          completed: 'Completed',
          cancelled: 'Cancelled',
          expired: 'Expired (No-show)'
        };

        let timerHtml = '';
        if (booking.status === 'booked') {
          timerHtml = `<span class="booking-timer timer-upcoming" data-timer-booking="${booking._id}" data-timer-type="upcoming" data-timer-created="${booking.createdAt}">—</span>`;
        } else if (booking.status === 'checked_in') {
          timerHtml = `<span class="booking-timer timer-active" data-timer-booking="${booking._id}" data-timer-type="active" data-timer-checkedin="${booking.checkedInAt}">—</span>`;
        }

        // Cancel button logic: only show for booked status, disable after 2 min
        let actions = '';
        if (booking.status === 'booked') {
          const cancelAllowed = isCancelAllowed(booking);
          const cancelTimeLeft = getCancelTimeLeft(booking);
          const cancelDisabledClass = cancelAllowed ? '' : 'btn-cancel-disabled';
          const cancelDisabledAttr = cancelAllowed ? '' : 'disabled';
          const cancelCountdownHtml = cancelAllowed
            ? `<span class="cancel-countdown" data-cancel-booking="${booking._id}" data-cancel-created="${booking.createdAt}">Cancel available for ${Math.floor(cancelTimeLeft / 60)}m ${cancelTimeLeft % 60}s</span>`
            : `<span class="cancel-countdown">⏰ Cancel window expired</span>`;

          actions = `
            <div>
              <button class="btn btn-primary btn-sm" onclick="showQR('${booking._id}')">📱 QR Code</button>
              <button class="btn btn-danger btn-sm ${cancelDisabledClass}" id="cancel-btn-${booking._id}" onclick="cancelBooking('${booking._id}')" ${cancelDisabledAttr}>Cancel</button>
              ${cancelCountdownHtml}
            </div>
          `;
        } else if (booking.status === 'checked_in') {
          actions = `
            <button class="btn btn-secondary btn-sm" onclick="checkoutBooking('${booking._id}')">🚪 Check Out</button>
          `;
        }

        return `
          <div class="booking-card animate-in">
            <div class="booking-card-header">
              <span class="badge ${statusColors[booking.status]} badge-dot">${statusLabels[booking.status]}</span>
              ${timerHtml}
            </div>
            <div class="booking-card-body">
              <div class="booking-seat-badge">${seat.seatCode || '?'}</div>
              <div class="booking-info">
                <h4 style="margin-bottom:var(--space-1);">Seat ${seat.seatCode || '?'} · ${seat.zone || ''} Zone</h4>
                <p style="margin:0; font-size:var(--text-sm); color:var(--muted);">
                  Reserved at: ${new Date(booking.createdAt).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}
                </p>
                ${seat.features?.length ? `<div style="margin-top:var(--space-2); display:flex; gap:var(--space-1);">${seat.features.map(f => `<span class="badge badge-neutral" style="font-size:10px;">${f}</span>`).join('')}</div>` : ''}
              </div>
              <div class="booking-actions">${actions}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    function updateTimers() {
      const now = new Date();

      // Update expiry timers
      document.querySelectorAll('[data-timer-booking]').forEach(el => {
        const type = el.dataset.timerType;

        if (type === 'upcoming') {
          const createdAt = new Date(el.dataset.timerCreated);
          const expiryDate = new Date(createdAt.getTime() + 15 * 60000); // 15 mins expiry
          const diff = expiryDate - now;

          if (diff <= 0) {
            el.textContent = 'Expired';
            el.className = 'booking-timer timer-checkin';
          } else {
            const mins = Math.floor(diff / 60000);
            const secs = Math.floor((diff % 60000) / 1000);
            el.textContent = `Expires in ${mins}m ${secs}s`;
          }
        } else if (type === 'active') {
          const checkedInAt = new Date(el.dataset.timerCheckedin);
          const maxEndTime = new Date(checkedInAt.getTime() + 4 * 3600000); // 4 hours max
          const diff = maxEndTime - now;

          if (diff <= 0) {
            el.textContent = 'Session ended';
          } else {
            const mins = Math.floor(diff / 60000);
            const hrs = Math.floor(mins / 60);
            if (hrs > 0) {
              el.textContent = `${hrs}h ${mins % 60}m remaining`;
            } else {
              el.textContent = `${mins}m remaining`;
            }
          }
        }
      });

      // Update cancel countdown timers
      document.querySelectorAll('[data-cancel-booking]').forEach(el => {
        const createdAt = new Date(el.dataset.cancelCreated).getTime();
        const elapsed = Date.now() - createdAt;
        const remaining = CANCEL_WINDOW_MS - elapsed;

        if (remaining <= 0) {
          // Cancel window expired — disable the button
          el.textContent = '⏰ Cancel window expired';
          el.removeAttribute('data-cancel-booking');
          el.removeAttribute('data-cancel-created');

          const bookingId = el.dataset.cancelBooking || el.closest('.booking-card')?.querySelector('[id^="cancel-btn-"]')?.id?.replace('cancel-btn-', '');
          const cancelBtn = el.parentElement?.querySelector('.btn-danger');
          if (cancelBtn) {
            cancelBtn.classList.add('btn-cancel-disabled');
            cancelBtn.setAttribute('disabled', 'true');
            cancelBtn.onclick = null;
          }
        } else {
          const secs = Math.ceil(remaining / 1000);
          const mins = Math.floor(secs / 60);
          const remSecs = secs % 60;
          el.textContent = `Cancel available for ${mins}m ${String(remSecs).padStart(2, '0')}s`;
        }
      });
    }

    async function showQR(bookingId) {
      try {
        const data = await api.get(`/bookings/${bookingId}/qr`);
        const booking = allBookings.find(b => b._id === bookingId);
        const seat = booking?.seat || {};

        document.getElementById('qr-display').innerHTML = `
          <div style="background: #ffffff; padding: var(--space-4); display: inline-block; border-radius: var(--radius-sm);">
            <img src="${data.qrImage}" alt="QR Code" class="qr-image" style="width:250px; height:250px; display:block; opacity: 1 !important; filter: none !important; mix-blend-mode: normal !important; box-shadow: none !important; border: none !important;">
          </div>
          <div style="margin-top:var(--space-4); font-size:var(--text-sm); color:var(--text);">
            <strong>Seat ${seat.seatCode || '?'}</strong> · ${seat.zone || ''} Zone<br>
            ${booking ? `Reserved at: ${new Date(booking.createdAt).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}` : ''}<br>
            <span style="color:var(--warning); font-size:var(--text-xs); font-weight: 600;">Show this at the entrance to check in</span>
          </div>
        `;
        Modal.show('qr-modal');
      } catch (err) {
        Toast.error(err.message || 'Failed to load QR code');
      }
    }

    async function cancelBooking(bookingId) {
      // Double-check cancel window on click
      const booking = allBookings.find(b => b._id === bookingId);
      if (booking && !isCancelAllowed(booking)) {
        Toast.error('Cancel window has expired (2 minutes). You can no longer cancel this booking.');
        renderBookings();
        return;
      }

      if (!confirm('Are you sure you want to cancel this booking?')) return;

      try {
        await api.delete(`/bookings/${bookingId}`);
        Toast.success('Booking cancelled');
        await loadBookings();
      } catch (err) {
        Toast.error(err.message || 'Failed to cancel');
      }
    }

    async function checkoutBooking(bookingId) {
      try {
        await api.post(`/bookings/${bookingId}/checkout`);
        Toast.success('Checked out! Seat is now free.');
        await loadBookings();
      } catch (err) {
        Toast.error(err.message || 'Failed to check out');
      }
    }
  </script>
</body>
</html>
