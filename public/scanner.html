<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Scanner — Smart Library</title>
  <meta name="description" content="Scan student QR codes for check-in and check-out at the library entrance.">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages.css">
  <link rel="stylesheet" href="/css/dark.css">
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    .scanner-container {
      max-width: 500px;
      margin: 0 auto;
    }
    #scanner-region {
      width: 100%;
      border-radius: var(--radius);
      overflow: hidden;
      border: 3px solid var(--primary);
      box-shadow: none !important;
      /* Kill ALL visual effects that could interfere with QR detection */
      filter: none !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      transform: none !important;
      opacity: 1 !important;
      mix-blend-mode: normal !important;
      isolation: isolate;
    }
    /* Force raw, unprocessed video feed — critical for QR detection */
    #scanner-region video,
    #scanner-region canvas,
    #scanner-region img {
      filter: none !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      transform: none !important;
      opacity: 1 !important;
      mix-blend-mode: normal !important;
      image-rendering: auto !important;
    }
    /* Override any inherited tilt/reveal/motion effects */
    #scanner-region,
    #scanner-region * {
      --parallax-y1: 0 !important;
      --parallax-y2: 0 !important;
      perspective: none !important;
      transform-style: flat !important;
    }
    /* Override the html5-qrcode library's own internal styles for clarity */
    #scanner-region #qr-shaded-region {
      border-color: rgba(99, 102, 241, 0.5) !important;
    }
    .scan-result {
      margin-top: var(--space-6);
      padding: var(--space-6);
      border-radius: var(--radius-lg);
      text-align: center;
      animation: fadeInUp 400ms ease;
    }
    .scan-success {
      background: var(--success-bg);
      border: 2px solid var(--success);
    }
    .scan-error {
      background: var(--danger-bg);
      border: 2px solid var(--danger);
    }
    .scan-result-icon {
      font-size: 64px;
      margin-bottom: var(--space-4);
    }
    .scan-result h2 {
      margin-bottom: var(--space-2);
    }
    .scan-result p {
      font-size: var(--text-lg);
      margin-bottom: var(--space-2);
    }
    .scan-details {
      display: flex;
      gap: var(--space-4);
      justify-content: center;
      flex-wrap: wrap;
      margin-top: var(--space-4);
    }
    .scan-detail-item {
      text-align: center;
    }
    .scan-detail-item .label {
      font-size: var(--text-xs);
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .scan-detail-item .value {
      font-size: var(--text-xl);
      font-weight: 700;
      font-family: var(--font-heading);
    }
    .manual-entry {
      margin-top: var(--space-6);
      padding: var(--space-4);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="container">
      <div class="section-header animate-in">
        <h1>🔍 QR Scanner</h1>
        <span class="badge badge-primary">Staff/Admin Only</span>
      </div>

      <div class="scanner-container animate-in">
        <p style="color:var(--muted); text-align:center; margin-bottom:var(--space-4);">
          Point the camera at a student's QR code to check them in or out.
        </p>

        <!-- Camera scanner -->
        <div id="scanner-region" style="position: relative;">
          <video id="qr-video" style="width: 100%; display: block; border-radius: var(--radius);"></video>
        </div>

        <!-- Manual entry fallback -->
        <div class="manual-entry">
          <h4 style="margin-bottom:var(--space-3);">Manual Token Entry</h4>
          <div style="display:flex; gap:var(--space-2);">
            <input type="text" id="manual-token" class="form-input" placeholder="Paste QR token here..." style="flex:1;">
            <button class="btn btn-primary" id="manual-submit">Check In</button>
          </div>
        </div>

        <!-- Result card -->
        <div id="scan-result" style="display:none;"></div>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    let html5QrCode = null;
    let scanCooldown = false;
    let lastScannedToken = '';

    document.addEventListener('DOMContentLoaded', async () => {
      if (!requireAuth()) return;
      if (!requireRole('staff', 'admin')) return;
      renderNavbar('scanner');

      // Add status indicator
      const statusEl = document.createElement('div');
      statusEl.id = 'scan-status';
      statusEl.style.cssText = 'text-align:center; padding:var(--space-2); font-size:var(--text-xs); color:var(--muted);';
      statusEl.textContent = 'Initializing camera...';
      document.getElementById('scanner-region').before(statusEl);

      try {
        html5QrCode = new Html5Qrcode("scanner-region");
        
        await html5QrCode.start(
          { facingMode: "environment" },
          {
            fps: 10,
            qrbox: { width: 250, height: 250 }
          },
          (decodedText, decodedResult) => {
            onScanSuccess(decodedText);
          },
          (errorMessage) => {
            // parse errors are frequent, ignore them
          }
        );

        statusEl.textContent = '🟢 Camera active — point at QR code';
        statusEl.style.color = 'var(--success)';

        // Add controls
        const controlsDiv = document.createElement('div');
        controlsDiv.style.cssText = 'display:flex; gap:var(--space-2); justify-content:center; flex-wrap:wrap; margin-top:var(--space-3);';
        controlsDiv.innerHTML = `
          <button class="btn btn-ghost btn-sm" id="stop-scan-btn">Stop</button>
          <label class="btn btn-primary btn-sm" style="cursor:pointer;">
            📁 Upload Image
            <input type="file" id="qr-file-input" accept="image/*" style="display:none;">
          </label>
        `;
        document.getElementById('scanner-region').after(controlsDiv);

        // Stop button
        document.getElementById('stop-scan-btn').addEventListener('click', () => {
          if (html5QrCode) {
            html5QrCode.stop().then(() => {
              statusEl.textContent = '⏹ Scanner stopped';
              statusEl.style.color = 'var(--muted)';
              document.getElementById('scanner-region').innerHTML = `
                <div style="padding:var(--space-8); text-align:center; color:var(--muted);">
                  <div style="font-size:48px; margin-bottom:var(--space-4);">📷</div>
                  <p>Scanner stopped.</p>
                  <button class="btn btn-primary btn-sm" onclick="location.reload()">Restart Scanner</button>
                </div>
              `;
            }).catch(err => console.error(err));
          }
        });

        // File upload scan
        document.getElementById('qr-file-input').addEventListener('change', async (e) => {
          const file = e.target.files[0];
          if (!file) return;
          statusEl.textContent = '📁 Scanning uploaded image...';
          try {
            const decodedText = await html5QrCode.scanFile(file, true);
            onScanSuccess(decodedText);
          } catch (err) {
            statusEl.textContent = '❌ No QR code found in image';
            statusEl.style.color = 'var(--danger)';
            Toast.error('Could not detect a QR code in the uploaded image. Try a clearer photo.');
          }
          e.target.value = '';
        });

      } catch (err) {
        console.warn('Scanner initialization failed:', err);
        statusEl.textContent = '❌ Camera failed to start';
        statusEl.style.color = 'var(--danger)';
        document.getElementById('scanner-region').innerHTML = `
          <div style="padding:var(--space-8); text-align:center; color:var(--muted);">
            <div style="font-size:48px; margin-bottom:var(--space-4);">📷</div>
            <p>Camera not available.</p>
            <p style="font-size:var(--text-xs); margin-top:var(--space-2);">${err.message || err}</p>
            <label class="btn btn-primary btn-sm" style="cursor:pointer; margin-top:var(--space-3);">
              📁 Scan from Image Instead
              <input type="file" id="qr-file-fallback" accept="image/*" style="display:none;">
            </label>
          </div>
        `;
        // File fallback
        document.getElementById('qr-file-fallback')?.addEventListener('change', async (e) => {
          const file = e.target.files[0];
          if (!file) return;
          try {
            const html5QrCodeFallback = new Html5Qrcode("scanner-region");
            const decodedText = await html5QrCodeFallback.scanFile(file, true);
            onScanSuccess(decodedText);
          } catch (err2) {
            Toast.error('Could not detect QR code in image.');
          }
          e.target.value = '';
        });
      }

      // Manual entry
      document.getElementById('manual-submit').addEventListener('click', () => {
        const token = document.getElementById('manual-token').value.trim();
        if (token) processToken(token);
      });

      document.getElementById('manual-token').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          const token = e.target.value.trim();
          if (token) processToken(token);
        }
      });
    });


    async function onScanSuccess(decodedText) {
      if (scanCooldown || decodedText === lastScannedToken) return;
      scanCooldown = true;
      lastScannedToken = decodedText;

      const statusEl = document.getElementById('scan-status');
      if (statusEl) {
        statusEl.textContent = '✅ QR Detected! Processing...';
        statusEl.style.color = 'var(--success)';
      }

      await processToken(decodedText);

      // Cooldown to prevent rapid re-scans
      setTimeout(() => {
        scanCooldown = false;
        lastScannedToken = '';
        if (statusEl) {
          statusEl.textContent = '🟢 Ready to scan next QR code';
          statusEl.style.color = 'var(--success)';
        }
      }, 3000);
    }

    async function processToken(token) {
      const resultDiv = document.getElementById('scan-result');

      try {
        const data = await api.post('/scan/checkin', { token });

        if (navigator.vibrate) navigator.vibrate(200);

        const student = data.student || {};
        const seat = data.seat || {};
        const action = data.action === 'checkout' ? 'Checked Out' : 'Checked In';
        const icon = data.action === 'checkout' ? '🚪' : '✅';

        resultDiv.style.display = 'block';
        resultDiv.innerHTML = `
          <div class="scan-result scan-success">
            <div class="scan-result-icon">${icon}</div>
            <h2>${action}!</h2>
            <p>${data.message}</p>
            <div class="scan-details">
              <div class="scan-detail-item">
                <div class="label">Student</div>
                <div class="value">${student.name || '—'}</div>
              </div>
              <div class="scan-detail-item">
                <div class="label">Seat</div>
                <div class="value">${seat.seatCode || '—'}</div>
              </div>
              <div class="scan-detail-item">
                <div class="label">Zone</div>
                <div class="value">${seat.zone || '—'}</div>
              </div>
            </div>
          </div>
        `;

        setTimeout(() => { resultDiv.style.display = 'none'; }, 5000);
      } catch (err) {
        if (navigator.vibrate) navigator.vibrate([100, 50, 100]);

        resultDiv.style.display = 'block';
        resultDiv.innerHTML = `
          <div class="scan-result scan-error">
            <div class="scan-result-icon">❌</div>
            <h2>Scan Failed</h2>
            <p>${err.message || 'Invalid QR code'}</p>
          </div>
        `;

        setTimeout(() => { resultDiv.style.display = 'none'; }, 4000);
      }

      document.getElementById('manual-token').value = '';
    }
  </script>
</body>
</html>
